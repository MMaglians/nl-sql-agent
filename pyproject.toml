[project]
name = "nl-sql-agent"
version = "0.1.0"
description = "NL-to-SQL agent over a read-only MCP server, with human approval"
readme = "README.md"
authors = [
    { name = "Matteo Magliano", email = "matteomagliano02@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.2,<4",
    "matplotlib>=3.11.2",
    "mcp>=2.3,<3",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
